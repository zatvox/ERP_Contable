<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 180" fill="currentColor" aria-hidden="true">
  <!-- GENKO — glifo. Geco visto desde arriba: geométrico, sin ojos ni cara.
       Proporción de geco real: cabeza 15%, cuerpo 35%, cola 50%.
       La cola larga y enroscada es la firma de la marca. -->
  <g stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- cola: cuatro tramos que adelgazan y terminan en espiral -->
    <path d="M60 96q0 20 4 34"      stroke-width="15" class="gk-cola"/>
    <path d="M64 130q5 15-2 23"     stroke-width="10" class="gk-cola"/>
    <path d="M62 153q-6 9 2 13"     stroke-width="6.5" class="gk-cola"/>
    <path d="M64 166q7 3 7-4"       stroke-width="4"  class="gk-cola"/>
    <!-- patas con codo -->
    <path d="M50 50 30 34 18 44" stroke-width="10" class="gk-pata gk-pata--fi"/>
    <path d="M70 50 90 34 102 44" stroke-width="10" class="gk-pata gk-pata--fd"/>
    <path d="M50 88 30 104 18 94" stroke-width="10" class="gk-pata gk-pata--ti"/>
    <path d="M70 88 90 104 102 94" stroke-width="10" class="gk-pata gk-pata--td"/>
  </g>
  <!-- cabeza -->
  <path d="M60 10c7.7 0 13.9 6.1 13.9 13.6 0 5.8-3.4 10.3-8 12.4H54.1c-4.6-2.1-8-6.6-8-12.4C46.1 16.1 52.3 10 60 10z"/>
  <!-- cuerpo -->
  <path d="M54.6 33c-9.4 3.6-14.6 15.2-14.6 29.8 0 17.4 5.6 31.6 11.6 39.2h16.8C74.4 94.4 80 80.2 80 62.8 80 48.2 74.8 36.6 65.4 33z"/>
  <!-- dedos -->
  <g>
    <circle cx="13" cy="37" r="3.2"/><circle cx="9"  cy="43" r="3.2"/>
    <circle cx="10" cy="51" r="3.2"/><circle cx="16" cy="55" r="3.2"/>
    <circle cx="107" cy="37" r="3.2"/><circle cx="111" cy="43" r="3.2"/>
    <circle cx="110" cy="51" r="3.2"/><circle cx="104" cy="55" r="3.2"/>
    <circle cx="13" cy="101" r="3.2"/><circle cx="9"  cy="95" r="3.2"/>
    <circle cx="10" cy="87" r="3.2"/><circle cx="16" cy="83" r="3.2"/>
    <circle cx="107" cy="101" r="3.2"/><circle cx="111" cy="95" r="3.2"/>
    <circle cx="110" cy="87" r="3.2"/><circle cx="104" cy="83" r="3.2"/>
  </g>
</svg>
