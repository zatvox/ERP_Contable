<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="icon" href="data:,">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JHIRO ERP - Login</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="login-page">
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <h1>JHIRO ERP</h1>
        <p>Sistema Contable para Importadoras</p>
      </div>

      <!-- ── PANEL LOGIN ── -->
      <div id="panel-login">
        <form id="loginForm" class="login-form">
          <div class="form-group">
            <label for="email">Correo electrónico</label>
            <input type="email" id="email" placeholder="usuario@empresa.com"
                   autocomplete="email" required>
          </div>
          <div class="form-group">
            <label for="password">Contraseña</label>
            <div style="position:relative;">
              <input type="password" id="password" placeholder="••••••••"
                     autocomplete="off" required style="padding-right:40px; width:100%; box-sizing:border-box;">
              <button type="button" onclick="toggleVer('password', this)"
                      style="position:absolute; right:10px; top:50%; transform:translateY(-50%);
                             background:none; border:none; cursor:pointer; padding:0; color:#94a3b8;"
                      title="Mostrar/ocultar contraseña">
                <svg id="ico-password" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                     viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>
          <button type="submit" class="btn btn-login">Ingresar</button>
        </form>

        <div id="loginError" class="login-error" style="display:none;"></div>

        <div style="text-align:center; margin-top:20px; padding-top:16px;
                    border-top:1px solid var(--border-color, #e2e8f0);">
          <p style="color:var(--text-secondary); font-size:0.9rem; margin:0 0 10px;">
            ¿Aún no tienes cuenta?
          </p>
          <button type="button" onclick="mostrarRegistro()"
                  style="background:none; border:none; cursor:pointer;
                         color:var(--color-primary, #4c6ef5); font-weight:600;
                         font-size:0.95rem; text-decoration:underline;">
            Registrarse
          </button>
        </div>
      </div>

      <!-- ── PANEL REGISTRO ── -->
      <div id="panel-registro" style="display:none;">
        <form id="registroForm" class="login-form">
          <div class="form-group">
            <label for="reg-nombre">Nombre completo</label>
            <input type="text" id="reg-nombre" placeholder="Ej: María García López" required>
          </div>
          <div class="form-group">
            <label for="reg-email">Correo electrónico</label>
            <input type="email" id="reg-email" placeholder="usuario@empresa.com"
                   autocomplete="email" required>
          </div>
          <div class="form-group">
            <label for="reg-password">Contraseña</label>
            <div style="position:relative;">
              <input type="password" id="reg-password" placeholder="Mínimo 8 caracteres"
                     autocomplete="new-password" required style="padding-right:40px; width:100%; box-sizing:border-box;">
              <button type="button" onclick="toggleVer('reg-password', this)"
                      style="position:absolute; right:10px; top:50%; transform:translateY(-50%);
                             background:none; border:none; cursor:pointer; padding:0; color:#94a3b8;"
                      title="Mostrar/ocultar contraseña">
                <svg id="ico-reg-password" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                     viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <div class="form-group">
            <label for="reg-confirm">Confirmar contraseña</label>
            <div style="position:relative;">
              <input type="password" id="reg-confirm" placeholder="Repite la contraseña"
                     autocomplete="new-password" required style="padding-right:40px; width:100%; box-sizing:border-box;">
              <button type="button" onclick="toggleVer('reg-confirm', this)"
                      style="position:absolute; right:10px; top:50%; transform:translateY(-50%);
                             background:none; border:none; cursor:pointer; padding:0; color:#94a3b8;"
                      title="Mostrar/ocultar contraseña">
                <svg id="ico-reg-confirm" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                     viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <button type="submit" class="btn btn-login">Crear cuenta</button>
        </form>

        <div id="registroError"
             style="display:none; margin-top:12px; padding:10px; border-radius:6px;
                    background:rgba(220,53,69,.1); color:#dc3545; font-size:0.9rem;"></div>

        <div id="registroOk"
             style="display:none; margin-top:12px; padding:12px; border-radius:6px;
                    background:rgba(40,167,69,.1); color:#28a745; font-size:0.9rem;
                    line-height:1.5;"></div>

        <div style="text-align:center; margin-top:20px; padding-top:16px;
                    border-top:1px solid var(--border-color, #e2e8f0);">
          <button type="button" onclick="mostrarLogin()"
                  style="background:none; border:none; cursor:pointer;
                         color:var(--color-primary, #4c6ef5); font-weight:600;
                         font-size:0.95rem; text-decoration:underline;">
            ← Volver al login
          </button>
        </div>
      </div>

    </div>
  </div>

  <script type="module" src="assets/js/config.js"></script>
  <script type="module" src="assets/js/supabase-client.js"></script>
  <script type="module" src="assets/js/auth-supabase.js"></script>
  <script type="module" src="assets/js/auth-init.js"></script>
  <script type="module" src="assets/js/helpers.js"></script>

  <script>
    // ── LOGIN ────────────────────────────────────────────────────────────────
    async function handleLoginSubmit(e) {
      e.preventDefault()
      const email    = document.getElementById('email').value.trim()
      const password = document.getElementById('password').value
      const errorDiv = document.getElementById('loginError')
      const btnLogin = document.querySelector('#panel-login .btn-login')

      errorDiv.style.display = 'none'
      btnLogin.disabled = true; btnLogin.textContent = 'Ingresando...'

      try {
        const result = await window.login(email, password)
        if (result && result.success) {
          window.location.href = 'dashboard.html'
        } else {
          errorDiv.textContent = (result && result.message) || 'Correo o contraseña incorrectos'
          errorDiv.style.display = 'block'
          document.getElementById('password').value = ''
        }
      } catch (err) {
        errorDiv.textContent = 'Error al iniciar sesión. Intenta de nuevo.'
        errorDiv.style.display = 'block'
      } finally {
        btnLogin.disabled = false; btnLogin.textContent = 'Ingresar'
      }
    }

    // ── REGISTRO ─────────────────────────────────────────────────────────────
    async function handleRegistroSubmit(e) {
      e.preventDefault()
      const nombre   = document.getElementById('reg-nombre').value.trim()
      const email    = document.getElementById('reg-email').value.trim()
      const password = document.getElementById('reg-password').value
      const errDiv   = document.getElementById('registroError')
      const okDiv    = document.getElementById('registroOk')
      const btn      = document.querySelector('#panel-registro .btn-login')

      errDiv.style.display = 'none'
      okDiv.style.display  = 'none'

      const confirm = document.getElementById('reg-confirm').value

      if (!nombre) { errDiv.textContent = 'Ingresa tu nombre.'; errDiv.style.display = 'block'; return }
      if (password.length < 8) { errDiv.textContent = 'La contraseña debe tener al menos 8 caracteres.'; errDiv.style.display = 'block'; return }
      if (password !== confirm) { errDiv.textContent = 'Las contraseñas no coinciden.'; errDiv.style.display = 'block'; return }

      btn.disabled = true; btn.textContent = 'Creando cuenta...'

      try {
        // Accedemos a supabase a través del módulo cargado
        const { supabase } = await import('./assets/js/supabase-client.js')

        const { data, error } = await supabase.auth.signUp({
          email,
          password,
          options: { data: { nombre, role: 'user' } }
        })

        if (error) throw error

        const confirmacionRequerida = !data?.user?.confirmed_at && !data?.user?.email_confirmed_at

        if (confirmacionRequerida) {
          okDiv.innerHTML = `✅ Cuenta creada para <strong>${nombre}</strong>.<br>
            Revisa tu correo <strong>${email}</strong> y confirma tu cuenta para poder ingresar.`
        } else {
          okDiv.innerHTML = `✅ Cuenta creada exitosamente. Ya puedes <button type="button"
            onclick="mostrarLogin()" style="background:none;border:none;cursor:pointer;
            color:#28a745;font-weight:700;text-decoration:underline;">iniciar sesión</button>.`
        }
        okDiv.style.display = 'block'
        document.getElementById('registroForm').reset()

      } catch (err) {
        let msg = err.message || 'Error al crear la cuenta'
        if (msg.includes('already registered')) msg = 'Este correo ya tiene una cuenta. Intenta iniciar sesión.'
        if (msg.includes('signup is disabled'))  msg = 'El registro está desactivado. Contacta al administrador.'
        errDiv.innerHTML = '⚠️ ' + msg
        errDiv.style.display = 'block'
      } finally {
        btn.disabled = false; btn.textContent = 'Crear cuenta'
      }
    }

    // ── OJO: MOSTRAR/OCULTAR CONTRASEÑA ─────────────────────────────────────
    function toggleVer(inputId, btn) {
      const input = document.getElementById(inputId)
      const show  = input.type === 'password'
      input.type  = show ? 'text' : 'password'
      // Cambia el icono: ojo abierto / ojo tachado
      btn.querySelector('svg').innerHTML = show
        ? /* ojo tachado */
          `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
           <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
           <line x1="1" y1="1" x2="23" y2="23"/>`
        : /* ojo abierto */
          `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
           <circle cx="12" cy="12" r="3"/>`
      btn.style.color = show ? '#4c6ef5' : '#94a3b8'
    }

    // ── TOGGLE PANELES ───────────────────────────────────────────────────────
    function mostrarRegistro() {
      document.getElementById('panel-login').style.display    = 'none'
      document.getElementById('panel-registro').style.display = 'block'
      document.getElementById('registroError').style.display  = 'none'
      document.getElementById('registroOk').style.display     = 'none'
    }

    function mostrarLogin() {
      document.getElementById('panel-login').style.display    = 'block'
      document.getElementById('panel-registro').style.display = 'none'
      document.getElementById('loginError').style.display     = 'none'
    }

    // ── INIT ─────────────────────────────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('loginForm').addEventListener('submit', handleLoginSubmit)
      document.getElementById('registroForm').addEventListener('submit', handleRegistroSubmit)
    })
  </script>
</body>
</html>
